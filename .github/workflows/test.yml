name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  actions:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: A changelog to read
        shell: pwsh
        run: |
          @(
            '# Changelog', '', '## [Unreleased]', '', '## [1.2.0] - 2026-09-28', '', '### Added', '- the thing', '',
            '## [1.1.0] - 2026-09-01', '', '- older'
          ) -join "`n" | Set-Content "$env:RUNNER_TEMP/CHANGELOG.md" -Encoding utf8
      - id: notes
        uses: ./actions/changelog-notes
        with:
          version: v1.2.0
          changelog: ${{ runner.temp }}/CHANGELOG.md
      - name: The notes are exactly that version's section
        shell: pwsh
        run: |
          $got = (Get-Content '${{ steps.notes.outputs.file }}' -Raw).Trim()
          $want = "### Added`n- the thing"
          if ($got -ne $want) { throw "got:`n$got" }
      - id: last
        uses: ./actions/changelog-notes
        with:
          version: 1.1.0
          changelog: ${{ runner.temp }}/CHANGELOG.md
      - name: The last section runs to the end of the file
        shell: pwsh
        run: if ((Get-Content '${{ steps.last.outputs.file }}' -Raw).Trim() -ne '- older') { throw 'wrong last section' }
      - name: Fetching without a token warns and copies nothing
        uses: ./actions/fetch-deps
        with:
          folder: Example
          destination: out
      - name: Something to sign
        shell: pwsh
        run: Set-Content "$env:RUNNER_TEMP/app.exe" 'not a real program'
      - name: Method none signs nothing and says so
        uses: ./actions/sign
        with:
          files: ${{ runner.temp }}/app.exe
